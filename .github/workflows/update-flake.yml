name: Update flake.lock

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nix-setup
      - uses: DeterminateSystems/update-flake-lock@v28
        with:
          pr-title: "chore(flake): update flake.lock"
          pr-labels: |
            dependencies
